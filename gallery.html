/* =========================================================
   GALLERY PAGE
========================================================= */

.gallery-page-intro {
  max-width: 760px;
  margin: 0 auto;
  text-align: center;
}

.gallery-page-intro p {
  line-height: 1.8;
}


/* =========================================================
   FILTERS
========================================================= */

.gallery-filters {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-bottom: 38px;
}

.filter-btn {
  border: 1px solid rgba(23, 42, 58, 0.16);
  background: #fff;
  color: #172A3A;
  padding: 10px 18px;
  border-radius: 999px;
  font-family: "Work Sans", "Noto Sans Devanagari", sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition:
    background 0.25s ease,
    color 0.25s ease,
    border-color 0.25s ease,
    transform 0.25s ease;
}

.filter-btn:hover {
  transform: translateY(-1px);
  border-color: #B8904A;
}

.filter-btn.active {
  background: #172A3A;
  color: #fff;
  border-color: #172A3A;
}


/* =========================================================
   GALLERY GRID
========================================================= */

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 20px;
}

.gallery-item {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  padding: 0;
  border: 0;
  border-radius: 18px;
  overflow: hidden;
  background: #f3f0ea;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(23, 42, 58, 0.08);
  transition:
    transform 0.3s ease,
    box-shadow 0.3s ease;
}

.gallery-item:hover {
  transform: translateY(-4px);
  box-shadow: 0 14px 32px rgba(23, 42, 58, 0.14);
}

.gallery-item img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  transition: transform 0.5s ease;
}

.gallery-item:hover img {
  transform: scale(1.045);
}


/* =========================================================
   EMPTY / INFO MESSAGE
========================================================= */

.gallery-info {
  max-width: 720px;
  margin: 42px auto 0;
  padding: 20px 24px;
  border-radius: 16px;
  background: #faf7f0;
  border: 1px solid rgba(184, 144, 74, 0.22);
  text-align: center;
  line-height: 1.8;
}


/* =========================================================
   LIGHTBOX
========================================================= */

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(10, 20, 28, 0.94);
}

.lightbox.open {
  display: flex;
}

.lightbox-inner {
  position: relative;
  width: min(100%, 1000px);
}

.lightbox-inner img {
  display: block;
  width: auto;
  max-width: 100%;
  max-height: 78vh;
  margin: 0 auto;
  border-radius: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}

#lightboxCaption {
  color: #fff;
  font-family: "Noto Sans Devanagari", "Work Sans", sans-serif;
  line-height: 1.6;
}

.lightbox-close {
  position: absolute;
  top: 18px;
  right: 22px;
  z-index: 2;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  color: #fff;
  font-size: 30px;
  line-height: 1;
  cursor: pointer;
  transition: background 0.25s ease;
}

.lightbox-close:hover {
  background: rgba(255,255,255,0.22);
}


/* =========================================================
   MOBILE
========================================================= */

<script>

/* =========================================================
   GALLERY FILTER
========================================================= */

(function () {

  const filterButtons = document.querySelectorAll(".filter-btn");
  const galleryItems = document.querySelectorAll(".gallery-item");

  filterButtons.forEach(function (button) {

    button.addEventListener("click", function () {

      const filter = this.getAttribute("data-filter");

      filterButtons.forEach(function (btn) {
        btn.classList.remove("active");
      });

      this.classList.add("active");

      galleryItems.forEach(function (item) {

        const category = item.getAttribute("data-cat");

        if (filter === "all" || category === filter) {
          item.style.display = "";
        } else {
          item.style.display = "none";
        }

      });

    });

  });

})();


/* =========================================================
   LIGHTBOX
========================================================= */

(function () {

  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const lightboxCaption = document.getElementById("lightboxCaption");
  const lightboxClose = document.getElementById("lightboxClose");
  const galleryItems = document.querySelectorAll(".gallery-item");

  if (!lightbox || !lightboxImg || !lightboxClose) {
    return;
  }


  function getCurrentLanguage() {

    const html = document.documentElement;

    return html.getAttribute("data-lang") || "mr";

  }


  function openLightbox(item) {

    const image = item.querySelector("img");

    if (!image) {
      return;
    }

    const lang = getCurrentLanguage();

    const captionMR =
      item.getAttribute("data-caption-mr") || "";

    const captionEN =
      item.getAttribute("data-caption-en") || "";

    lightboxImg.src = image.src;

    lightboxImg.alt = image.alt || "";

    lightboxCaption.textContent =
      lang === "en" ? captionEN : captionMR;

    lightbox.classList.add("open");

    document.body.style.overflow = "hidden";

    lightbox.focus();

  }


  function closeLightbox() {

    lightbox.classList.remove("open");

    lightboxImg.src = "";

    document.body.style.overflow = "";

  }


  galleryItems.forEach(function (item) {

    item.addEventListener("click", function () {

      openLightbox(this);

    });

  });


  lightboxClose.addEventListener("click", function () {

    closeLightbox();

  });


  lightbox.addEventListener("click", function (event) {

    if (event.target === lightbox) {

      closeLightbox();

    }

  });


  document.addEventListener("keydown", function (event) {

    if (event.key === "Escape" && lightbox.classList.contains("open")) {

      closeLightbox();

    }

  });

})();

</script>
